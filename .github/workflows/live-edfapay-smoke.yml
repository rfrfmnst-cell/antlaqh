name: Live EdfaPay smoke test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/live-edfapay-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "lib/edfapay-checkout.js"
      - "lib/edfapay-webhook.js"
      - "server.js"
      - "public/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify live Antlaqh payment integration and release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://antlaqh.com"
          EXPECTED_RELEASE="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("package.json","utf8")).version)')"
          export EXPECTED_RELEASE

          echo "Waiting for deployed release $EXPECTED_RELEASE and expected payment config..."
          ok=0
          for i in $(seq 1 20); do
            config_code="$(curl -L -sS -o /tmp/config.json -w "%{http_code}" "$BASE/api/config" || true)"
            health_code="$(curl -L -sS -o /tmp/health.json -w "%{http_code}" "$BASE/api/health" || true)"
            if [ "$config_code" = "200" ] && [ "$health_code" = "200" ]; then
              if node -e '
                const fs=require("fs");
                const c=JSON.parse(fs.readFileSync("/tmp/config.json","utf8"));
                const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
                const expected=process.env.EXPECTED_RELEASE;
                if (!expected) throw new Error("EXPECTED_RELEASE is missing");
                if (c.release!==expected) throw new Error("Expected config release "+expected+", got: "+c.release);
                if (h.version!==expected) throw new Error("Expected health version "+expected+", got: "+h.version);
                if (c.release!==h.version) throw new Error("Config/health release mismatch: "+c.release+" vs "+h.version);
                if (c.environment!=="production") throw new Error("Live app is not reporting production mode");
                if (!c.paymentMethods?.bankTransfer?.available) throw new Error("Bank transfer is unexpectedly unavailable");
                if (!c.paymentMethods?.edfapay?.available) throw new Error("EdfaPay is not enabled in live config");
                if (c.paymentMethods.edfapay.mode!=="production") throw new Error("Expected EdfaPay production mode, got: "+c.paymentMethods.edfapay.mode);
                if (c.payments!=="edfapay_and_bank_transfer") throw new Error("Unexpected payments mode: "+c.payments);
                if (!String(c.siteOrigin||"").startsWith("https://antlaqh.com")) throw new Error("Unexpected siteOrigin: "+c.siteOrigin);
                console.log("LIVE_CONFIG_OK", JSON.stringify({
                  release:c.release,
                  healthVersion:h.version,
                  environment:c.environment,
                  payments:c.payments,
                  edfapay:c.paymentMethods.edfapay,
                  siteOrigin:c.siteOrigin
                }));
              '; then
                ok=1
                break
              fi
            fi
            echo "Attempt $i: config HTTP $config_code, health HTTP $health_code, release/config not ready"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "Live release/config did not become ready; expected $EXPECTED_RELEASE"
            echo "--- /api/config ---"
            cat /tmp/config.json 2>/dev/null || true
            echo
            echo "--- /api/health ---"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

          home_code="$(curl -L -sS -o /tmp/home.html -w "%{http_code}" "$BASE/" || true)"
          test "$home_code" = "200" || { echo "Homepage HTTP $home_code"; exit 1; }

          hook_code="$(curl -sS -o /tmp/hook.txt -w "%{http_code}" "$BASE/api/webhooks/edfapay" || true)"
          test "$hook_code" = "405" || { echo "Webhook GET returned HTTP $hook_code"; cat /tmp/hook.txt; exit 1; }
          grep -qx "ERROR" /tmp/hook.txt || { echo "Unexpected webhook GET body"; cat /tmp/hook.txt; exit 1; }

          echo "LIVE_RELEASE_OK $EXPECTED_RELEASE"
          echo "LIVE_HOMEPAGE_OK"
          echo "LIVE_WEBHOOK_ROUTE_OK"
